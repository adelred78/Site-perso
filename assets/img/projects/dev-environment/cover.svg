<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Setup environnement & Git workflow">
  <defs>
    <linearGradient id="bg-dev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="glow-dev" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-dev" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#38BDF8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Fond -->
  <rect width="1600" height="900" fill="url(#bg-dev)" />
  <rect width="1600" height="900" fill="url(#grid-dev)" />
  <rect width="1600" height="900" fill="url(#glow-dev)" />

  <!-- Mockup terminal -->
  <g transform="translate(220 180)">
    <rect width="1160" height="540" rx="16" fill="url(#terminal)" stroke="#334155" stroke-width="1.5" />

    <!-- Chrome -->
    <g transform="translate(28 28)">
      <circle cx="0" cy="0" r="8" fill="#ff5f57" />
      <circle cx="24" cy="0" r="8" fill="#febc2e" />
      <circle cx="48" cy="0" r="8" fill="#28c840" />
      <text x="90" y="6" font-family="JetBrains Mono, monospace" font-size="14" fill="#64748B">terminal · ~/site-perso</text>
    </g>
    <line x1="0" y1="60" x2="1160" y2="60" stroke="#334155" stroke-width="1" />

    <!-- Lignes de terminal -->
    <g font-family="JetBrains Mono, monospace" font-size="20" transform="translate(48 110)">
      <text fill="#94A3B8">$ <tspan fill="#38BDF8">git</tspan> <tspan fill="#E2E8F0">init</tspan></text>
      <text y="36" fill="#64748B">Initialized empty Git repository in .git/</text>

      <text y="86" fill="#94A3B8">$ <tspan fill="#38BDF8">git</tspan> <tspan fill="#E2E8F0">checkout -b feature/login</tspan></text>
      <text y="122" fill="#64748B">Switched to a new branch 'feature/login'</text>

      <text y="172" fill="#94A3B8">$ <tspan fill="#38BDF8">git</tspan> <tspan fill="#E2E8F0">commit -m</tspan> <tspan fill="#A3E635">"feat: auth flow"</tspan></text>
      <text y="208" fill="#64748B">[feature/login a8f3c12] feat: auth flow</text>

      <text y="258" fill="#94A3B8">$ <tspan fill="#38BDF8">git</tspan> <tspan fill="#E2E8F0">push -u origin feature/login</tspan></text>
      <text y="294" fill="#64748B">remote: ✓ build passed · ready to merge</text>

      <text y="354" fill="#94A3B8">$ <tspan fill="#FBBF24">vim</tspan> <tspan fill="#E2E8F0">.bashrc</tspan> <tspan fill="#38BDF8">_</tspan></text>
    </g>
  </g>

  <!-- Label en haut à gauche -->
  <g transform="translate(80 80)">
    <rect width="240" height="36" rx="6" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.4" />
    <text x="20" y="23" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" letter-spacing="1" fill="#7DD3FC">DEV · GIT · LINUX</text>
  </g>

  <!-- Étoiles décoratives -->
  <g fill="#38BDF8" opacity="0.6">
    <circle cx="1430" cy="180" r="2.5" />
    <circle cx="1480" cy="240" r="1.5" />
    <circle cx="1380" cy="280" r="2" />
    <circle cx="1500" cy="120" r="1.8" />
  </g>
</svg>
