<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Setup environnement & Git workflow — branches et commits">
  <defs>
    <linearGradient id="bg-dev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="glow-dev" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-dev-2" cx="0.15" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.15" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-dev" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#38BDF8" fill-opacity="0.1" />
    </pattern>

    <!-- Gradients pour les branches -->
    <linearGradient id="branch-main" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#7DD3FC" />
    </linearGradient>
    <linearGradient id="branch-feature" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" />
      <stop offset="1" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="branch-fix" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4" />
      <stop offset="1" stop-color="#34D399" />
    </linearGradient>

    <!-- Glow pour les commits -->
    <filter id="commit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1600" height="900" fill="url(#bg-dev)" />
  <rect width="1600" height="900" fill="url(#grid-dev)" />
  <rect width="1600" height="900" fill="url(#glow-dev)" />
  <rect width="1600" height="900" fill="url(#glow-dev-2)" />

  <!-- Label haut gauche -->
  <g transform="translate(80 80)">
    <rect width="280" height="40" rx="8" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45" />
    <text x="22" y="26" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" letter-spacing="1.5" fill="#7DD3FC">GIT · WORKFLOW</text>
  </g>

  <!-- Titre central éditorial -->
  <g transform="translate(80 160)" font-family="Bricolage Grotesque, sans-serif">
    <text font-size="78" font-weight="700" fill="#F8FAFC" letter-spacing="-0.02em">git checkout -b</text>
    <text y="92" font-size="78" font-weight="700" fill="#38BDF8" letter-spacing="-0.02em">feature/excellence</text>
  </g>

  <!-- === Git graph : 3 branches qui mergent === -->
  <g transform="translate(80 460)">
    <!-- Légende branches -->
    <g font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1">
      <g transform="translate(0 0)">
        <rect x="-4" y="-12" width="80" height="22" rx="4" fill="#38BDF8" fill-opacity="0.12" />
        <text x="6" y="4" fill="#7DD3FC">main</text>
      </g>
      <g transform="translate(0 80)">
        <rect x="-4" y="-12" width="96" height="22" rx="4" fill="#A78BFA" fill-opacity="0.12" />
        <text x="6" y="4" fill="#C4B5FD">feature</text>
      </g>
      <g transform="translate(0 160)">
        <rect x="-4" y="-12" width="60" height="22" rx="4" fill="#5EEAD4" fill-opacity="0.12" />
        <text x="6" y="4" fill="#6EE7B7">fix</text>
      </g>
    </g>

    <!-- Branches : lignes principales (translation pour pas overlap legende) -->
    <g transform="translate(160 0)">
      <!-- main line -->
      <path d="M 0 0 L 1280 0" stroke="url(#branch-main)" stroke-width="3" stroke-linecap="round" />
      <!-- feature branch : se sépare puis re-merge -->
      <path d="M 80 0 Q 140 0, 180 80 L 720 80 Q 760 80, 800 0"
            fill="none" stroke="url(#branch-feature)" stroke-width="3" stroke-linecap="round" />
      <!-- fix branch : courte -->
      <path d="M 480 80 Q 540 80, 580 160 L 940 160 Q 980 160, 1020 80"
            fill="none" stroke="url(#branch-fix)" stroke-width="3" stroke-linecap="round" />

      <!-- Commits main -->
      <g filter="url(#commit-glow)">
        <circle cx="0" cy="0" r="10" fill="#0B1220" stroke="#38BDF8" stroke-width="3" />
        <circle cx="80" cy="0" r="10" fill="#0B1220" stroke="#38BDF8" stroke-width="3" />
        <circle cx="400" cy="0" r="10" fill="#0B1220" stroke="#38BDF8" stroke-width="3" />
        <circle cx="800" cy="0" r="12" fill="#38BDF8" stroke="#0B1220" stroke-width="3" />
        <circle cx="1100" cy="0" r="10" fill="#0B1220" stroke="#38BDF8" stroke-width="3" />
        <circle cx="1280" cy="0" r="13" fill="#7DD3FC" stroke="#0B1220" stroke-width="3" />
      </g>

      <!-- Commits feature -->
      <g filter="url(#commit-glow)">
        <circle cx="260" cy="80" r="9" fill="#0B1220" stroke="#A78BFA" stroke-width="3" />
        <circle cx="480" cy="80" r="9" fill="#0B1220" stroke="#A78BFA" stroke-width="3" />
        <circle cx="720" cy="80" r="9" fill="#A78BFA" stroke="#0B1220" stroke-width="3" />
        <circle cx="1020" cy="80" r="9" fill="#0B1220" stroke="#A78BFA" stroke-width="3" />
      </g>

      <!-- Commits fix -->
      <g filter="url(#commit-glow)">
        <circle cx="660" cy="160" r="8" fill="#0B1220" stroke="#5EEAD4" stroke-width="3" />
        <circle cx="940" cy="160" r="8" fill="#5EEAD4" stroke="#0B1220" stroke-width="3" />
      </g>

      <!-- Labels des commits importants -->
      <g font-family="JetBrains Mono, monospace" font-size="11" fill="#64748B" letter-spacing="0.5">
        <text x="-10" y="-22">init</text>
        <text x="70" y="-22">setup</text>
        <text x="390" y="-22">linux vm</text>
        <text x="780" y="-22">merge</text>
        <text x="1265" y="-22" text-anchor="end">main ↑</text>

        <text x="710" y="106" text-anchor="middle">commit</text>
        <text x="935" y="186" text-anchor="middle">hotfix</text>
      </g>

      <!-- Tag final HEAD -->
      <g transform="translate(1280 -50)">
        <polygon points="0,8 10,0 60,0 60,16 10,16" fill="#7DD3FC" />
        <text x="35" y="13" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0B1220">HEAD</text>
      </g>
    </g>
  </g>

  <!-- Stack icons en bas à droite -->
  <g transform="translate(1240 720)" font-family="JetBrains Mono, monospace" font-size="13" fill="#94A3B8" letter-spacing="1">
    <text text-anchor="end" x="280">linux · vscode · git · github</text>
  </g>

  <!-- Étoiles décoratives -->
  <g fill="#7DD3FC" opacity="0.6">
    <circle cx="1430" cy="240" r="2" />
    <circle cx="1490" cy="290" r="1.4" />
    <circle cx="1380" cy="340" r="2.4" />
    <circle cx="1520" cy="180" r="1.7" />
    <circle cx="100" cy="780" r="1.8" />
    <circle cx="180" cy="820" r="1.4" />
  </g>
</svg>
