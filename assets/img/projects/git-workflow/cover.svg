<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Logos Git et GitHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="glow-left" cx="0.25" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-right" cx="0.78" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.2" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#38BDF8" fill-opacity="0.1" />
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="arrow-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#A78BFA" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <rect width="1600" height="900" fill="url(#glow-left)" />
  <rect width="1600" height="900" fill="url(#glow-right)" />

  <!-- Pill badge -->
  <g transform="translate(80 80)">
    <rect width="300" height="38" rx="6" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45" />
    <text x="22" y="25" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" letter-spacing="1.5" fill="#7DD3FC">VERSION CONTROL · WORKFLOW</text>
  </g>

  <!-- Titre principal -->
  <g font-family="Bricolage Grotesque, sans-serif" letter-spacing="-0.02em">
    <text x="80" y="210" font-size="80" font-weight="800" fill="#F8FAFC">git push</text>
    <text x="80" y="290" font-size="80" font-weight="800" fill="#38BDF8">origin main</text>
  </g>

  <!-- LOGO GIT à gauche : diamant rotated avec branches -->
  <g transform="translate(290 620)" filter="url(#soft-glow)">
    <!-- Diamant -->
    <g transform="rotate(45)">
      <rect x="-130" y="-130" width="260" height="260" rx="24" fill="#0B1220" stroke="#38BDF8" stroke-width="6" />
    </g>

    <!-- Branches Git classiques -->
    <g stroke="#38BDF8" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M -80 0 L 80 0" />
      <path d="M 10 0 Q 10 -55, 65 -55" />
    </g>

    <!-- Commits cercles -->
    <g fill="#7DD3FC" stroke="#0B1220" stroke-width="5">
      <circle cx="-80" cy="0" r="18" />
      <circle cx="80" cy="0" r="18" />
      <circle cx="65" cy="-55" r="16" />
    </g>

    <!-- Label -->
    <text x="0" y="200" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.02em">Git</text>
    <text x="0" y="226" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.5" fill="#64748B">VERSION CONTROL</text>
  </g>

  <!-- FLÈCHES PUSH / PULL au milieu -->
  <g transform="translate(800 620)" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1.5">
    <g transform="translate(-100 -30)">
      <line x1="0" y1="0" x2="200" y2="0" stroke="url(#arrow-grad)" stroke-width="2.5" />
      <polygon points="200,0 186,-7 186,7" fill="#A78BFA" />
      <text x="100" y="-14" text-anchor="middle" fill="#7DD3FC" font-weight="600">push</text>
    </g>
    <g transform="translate(-100 30)">
      <line x1="200" y1="0" x2="0" y2="0" stroke="url(#arrow-grad)" stroke-width="2.5" />
      <polygon points="0,0 14,-7 14,7" fill="#38BDF8" />
      <text x="100" y="24" text-anchor="middle" fill="#C4B5FD" font-weight="600">pull</text>
    </g>
  </g>

  <!-- LOGO GITHUB à droite : Octocat -->
  <g transform="translate(1200 620)" filter="url(#soft-glow)">
    <circle r="135" fill="#0B1220" stroke="#A78BFA" stroke-width="6" />
    <g transform="scale(1.7)">
      <path d="M 0,-58
               C -32,-58 -58,-32 -58,0
               C -58,25 -42,46 -19,53
               C -16,54 -15,52 -15,50
               L -15,43
               C -30,46 -33,36 -33,36
               C -35,31 -38,30 -38,30
               C -42,27 -38,27 -38,27
               C -33,28 -31,32 -31,32
               C -27,39 -20,37 -17,36
               C -16,33 -15,31 -13,30
               C -25,28 -36,24 -36,9
               C -36,4 -34,1 -32,-3
               C -32,-4 -34,-9 -31,-15
               C -31,-15 -27,-16 -19,-11
               C -16,-12 -12,-13 -8,-13
               C -4,-13 0,-12 3,-11
               C 11,-16 15,-15 15,-15
               C 18,-9 16,-4 16,-3
               C 19,1 21,3 21,9
               C 21,24 9,28 -2,29
               C 0,31 2,34 2,38
               L 2,50
               C 2,52 3,54 6,53
               C 29,46 45,25 45,0
               C 45,-32 19,-58 0,-58 Z"
            fill="#C4B5FD" />
    </g>
    <text x="0" y="200" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.02em">GitHub</text>
    <text x="0" y="226" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.5" fill="#64748B">REMOTE · HOSTING</text>
  </g>

  <!-- Snippet bas -->
  <g transform="translate(80 810)" font-family="JetBrains Mono, monospace" font-size="16">
    <text fill="#94A3B8">$ <tspan fill="#38BDF8">git</tspan> <tspan fill="#E2E8F0">commit</tspan> <tspan fill="#94A3B8">&amp;&amp;</tspan> <tspan fill="#38BDF8">git</tspan> <tspan fill="#E2E8F0">push</tspan> <tspan fill="#A3E635">origin main</tspan></text>
  </g>

  <!-- Étoiles décoratives -->
  <g fill="#7DD3FC" opacity="0.5">
    <circle cx="1430" cy="180" r="2" />
    <circle cx="1500" cy="300" r="1.5" />
    <circle cx="180" cy="440" r="2.4" />
    <circle cx="120" cy="780" r="1.8" />
    <circle cx="800" cy="400" r="1.6" />
  </g>
</svg>
