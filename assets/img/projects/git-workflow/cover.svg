<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Setup environnement et Git workflow">
  <defs>
    <linearGradient id="bg-dev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="glow-dev" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-dev" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#38BDF8" fill-opacity="0.1" />
    </pattern>
    <linearGradient id="curve-commits" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#7DD3FC" />
    </linearGradient>
    <linearGradient id="curve-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-dev)" />
  <rect width="1600" height="900" fill="url(#grid-dev)" />
  <rect width="1600" height="900" fill="url(#glow-dev)" />

  <!-- Pill badge -->
  <g transform="translate(80 80)">
    <rect width="240" height="38" rx="6" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45" />
    <text x="22" y="25" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" letter-spacing="1.5" fill="#7DD3FC">GIT · WORKFLOW</text>
  </g>

  <!-- Labels axes -->
  <g font-family="JetBrains Mono, monospace" font-size="14" fill="#64748B" letter-spacing="1">
    <text x="220" y="780">temps (mois) →</text>
    <text x="190" y="200" text-anchor="end">commits</text>
  </g>

  <!-- Axes -->
  <g transform="translate(220 210)" stroke="#334155" stroke-width="2">
    <line x1="0" y1="0" x2="0" y2="540" />
    <line x1="0" y1="540" x2="1160" y2="540" />
    <g stroke-width="1" opacity="0.5">
      <line x1="232" y1="540" x2="232" y2="548" />
      <line x1="464" y1="540" x2="464" y2="548" />
      <line x1="696" y1="540" x2="696" y2="548" />
      <line x1="928" y1="540" x2="928" y2="548" />
      <line x1="1160" y1="540" x2="1160" y2="548" />
      <line x1="-8" y1="135" x2="0" y2="135" />
      <line x1="-8" y1="270" x2="0" y2="270" />
      <line x1="-8" y1="405" x2="0" y2="405" />
    </g>
  </g>

  <!-- Tick labels -->
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#64748B" letter-spacing="0.5">
    <text x="220" y="775" text-anchor="middle">sept</text>
    <text x="452" y="775" text-anchor="middle">nov</text>
    <text x="684" y="775" text-anchor="middle">jan</text>
    <text x="916" y="775" text-anchor="middle">mars</text>
    <text x="1148" y="775" text-anchor="middle">mai</text>
    <text x="1380" y="775" text-anchor="middle">juin</text>
  </g>

  <!-- Aire sous la courbe -->
  <path d="M 220 740 Q 380 720, 500 660 T 800 480 T 1100 280 T 1380 220 L 1380 750 L 220 750 Z"
        fill="url(#curve-area)" />

  <!-- Courbe principale (commits cumulés) -->
  <path d="M 220 740 Q 380 720, 500 660 T 800 480 T 1100 280 T 1380 220"
        fill="none"
        stroke="url(#curve-commits)"
        stroke-width="4"
        stroke-linecap="round" />

  <!-- Points data sur la courbe -->
  <g>
    <circle cx="220" cy="740" r="6" fill="#38BDF8" />
    <circle cx="380" cy="720" r="6" fill="#38BDF8" />
    <circle cx="560" cy="640" r="6" fill="#38BDF8" />
    <circle cx="720" cy="540" r="6" fill="#38BDF8" />
    <circle cx="900" cy="420" r="6" fill="#38BDF8" />
    <circle cx="1080" cy="310" r="6" fill="#38BDF8" />
    <circle cx="1280" cy="240" r="8" fill="#7DD3FC" stroke="#0B1220" stroke-width="2" />
  </g>

  <!-- Label sur le dernier point -->
  <g transform="translate(1280 200)">
    <rect x="-50" y="-22" width="100" height="22" rx="4" fill="#38BDF8" />
    <text x="0" y="-7" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0B1220">+1248 commits</text>
  </g>

  <!-- Petits commits dots éparpillés (style git log) -->
  <g fill="#38BDF8" opacity="0.45">
    <circle cx="320" cy="690" r="3" />
    <circle cx="440" cy="700" r="3" />
    <circle cx="600" cy="600" r="3" />
    <circle cx="780" cy="500" r="3" />
    <circle cx="980" cy="370" r="3" />
    <circle cx="1180" cy="270" r="3" />
  </g>

  <!-- Branches visualisation simplifiée à droite -->
  <g transform="translate(1230 320)" font-family="JetBrains Mono, monospace" font-size="13">
    <text fill="#94A3B8" letter-spacing="0.5">Branches actives</text>

    <g transform="translate(0 22)">
      <circle cx="8" cy="8" r="6" fill="#38BDF8" />
      <text x="24" y="12" fill="#7DD3FC">main</text>
    </g>
    <g transform="translate(0 48)">
      <circle cx="8" cy="8" r="6" fill="#A78BFA" />
      <text x="24" y="12" fill="#C4B5FD">feature/*</text>
    </g>
    <g transform="translate(0 74)">
      <circle cx="8" cy="8" r="6" fill="#5EEAD4" />
      <text x="24" y="12" fill="#6EE7B7">fix/*</text>
    </g>
  </g>

  <!-- Snippet code en bas -->
  <g transform="translate(80 700)" font-family="JetBrains Mono, monospace" font-size="16">
    <text fill="#94A3B8">$ <tspan fill="#38BDF8">git</tspan> <tspan fill="#E2E8F0">commit -m</tspan> <tspan fill="#A3E635">"feat: ship excellence"</tspan></text>
    <text y="28" fill="#64748B">linux · ubuntu · debian · vscode · pycharm · git · github</text>
  </g>

  <!-- Étoiles décoratives -->
  <g fill="#7DD3FC" opacity="0.5">
    <circle cx="1430" cy="180" r="2" />
    <circle cx="1490" cy="280" r="1.5" />
    <circle cx="1380" cy="350" r="2.4" />
    <circle cx="1530" cy="220" r="1.8" />
    <circle cx="120" cy="820" r="1.8" />
  </g>
</svg>
