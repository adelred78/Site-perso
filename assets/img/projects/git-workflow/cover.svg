<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Logos Git et GitHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1208" />
      <stop offset="0.5" stop-color="#0F172A" />
      <stop offset="1" stop-color="#15101F" />
    </linearGradient>
    <radialGradient id="orange-glow" cx="0.28" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#F05032" stop-opacity="0.28" />
      <stop offset="1" stop-color="#F05032" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cream-glow" cx="0.72" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.12" />
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="git-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F05032" />
      <stop offset="1" stop-color="#C73B22" />
    </linearGradient>
    <linearGradient id="github-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1E1E" />
      <stop offset="1" stop-color="#0D1117" />
    </linearGradient>

    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="14" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#orange-glow)" />
  <rect width="1600" height="900" fill="url(#cream-glow)" />

  <!-- Lignes de connexion verticales subtiles en arrière-plan -->
  <g stroke="#F05032" stroke-opacity="0.05" stroke-width="1">
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="1200" y1="0" x2="1200" y2="900" />
  </g>

  <!-- Pill badge -->
  <g transform="translate(80 80)">
    <rect width="260" height="40" rx="8" fill="#F05032" fill-opacity="0.15" stroke="#F05032" stroke-opacity="0.5" />
    <text x="22" y="26" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" letter-spacing="2" fill="#FB923C">GIT · GITHUB</text>
  </g>

  <!-- Titre -->
  <g font-family="Bricolage Grotesque, sans-serif" letter-spacing="-0.03em">
    <text x="80" y="230" font-size="92" font-weight="800" fill="#F8FAFC">build.</text>
    <text x="80" y="230" font-size="92" font-weight="800" fill="#FB923C" dx="290">commit.</text>
    <text x="80" y="230" font-size="92" font-weight="800" fill="#F8FAFC" dx="660">ship.</text>
  </g>

  <!-- ============================== -->
  <!-- CARTE GIT (orange) -->
  <!-- ============================== -->
  <g transform="translate(340 600) rotate(-5)" filter="url(#card-shadow)">
    <!-- Card body -->
    <rect x="-220" y="-180" width="440" height="360" rx="28" fill="url(#git-card)" />

    <!-- Texture pointillée subtile sur la card -->
    <g fill="#FFFFFF" fill-opacity="0.06">
      <circle cx="-180" cy="-140" r="2" />
      <circle cx="-100" cy="-150" r="1.5" />
      <circle cx="120" cy="-100" r="2.2" />
      <circle cx="180" cy="-160" r="1.8" />
      <circle cx="-140" cy="130" r="2" />
      <circle cx="150" cy="140" r="1.6" />
      <circle cx="0" cy="150" r="2.4" />
    </g>

    <!-- Diamant Git officiel -->
    <g transform="translate(0 -20)">
      <g transform="rotate(45)">
        <rect x="-78" y="-78" width="156" height="156" rx="14" fill="none" stroke="#FFFFFF" stroke-width="8" />
      </g>
      <!-- Branches internes -->
      <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M -48 0 L 48 0" />
        <path d="M 6 0 Q 6 -34, 40 -34" />
      </g>
      <g fill="#FFFFFF" stroke="#F05032" stroke-width="3">
        <circle cx="-48" cy="0" r="11" />
        <circle cx="48" cy="0" r="11" />
        <circle cx="40" cy="-34" r="10" />
      </g>
    </g>

    <!-- Label -->
    <g transform="translate(0 130)">
      <text text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">Git</text>
      <text y="26" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2.5" fill="#FED7AA">VERSION  CONTROL</text>
    </g>

    <!-- Coin perforation (style stamp) -->
    <g fill="#0F172A" opacity="0.4">
      <circle cx="-220" cy="-180" r="14" />
      <circle cx="220" cy="-180" r="14" />
      <circle cx="-220" cy="180" r="14" />
      <circle cx="220" cy="180" r="14" />
    </g>
  </g>

  <!-- ============================== -->
  <!-- CARTE GITHUB (dark) -->
  <!-- ============================== -->
  <g transform="translate(1180 600) rotate(5)" filter="url(#card-shadow)">
    <!-- Card body -->
    <rect x="-220" y="-180" width="440" height="360" rx="28" fill="url(#github-card)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />

    <!-- Texture pointillée -->
    <g fill="#FFFFFF" fill-opacity="0.06">
      <circle cx="-180" cy="-140" r="2" />
      <circle cx="160" cy="-150" r="1.5" />
      <circle cx="-100" cy="140" r="2.2" />
      <circle cx="170" cy="140" r="1.8" />
    </g>

    <!-- Octocat -->
    <g transform="translate(0 -20) scale(1.85)">
      <path d="M 0,-58
               C -32,-58 -58,-32 -58,0
               C -58,25 -42,46 -19,53
               C -16,54 -15,52 -15,50
               L -15,43
               C -30,46 -33,36 -33,36
               C -35,31 -38,30 -38,30
               C -42,27 -38,27 -38,27
               C -33,28 -31,32 -31,32
               C -27,39 -20,37 -17,36
               C -16,33 -15,31 -13,30
               C -25,28 -36,24 -36,9
               C -36,4 -34,1 -32,-3
               C -32,-4 -34,-9 -31,-15
               C -31,-15 -27,-16 -19,-11
               C -16,-12 -12,-13 -8,-13
               C -4,-13 0,-12 3,-11
               C 11,-16 15,-15 15,-15
               C 18,-9 16,-4 16,-3
               C 19,1 21,3 21,9
               C 21,24 9,28 -2,29
               C 0,31 2,34 2,38
               L 2,50
               C 2,52 3,54 6,53
               C 29,46 45,25 45,0
               C 45,-32 19,-58 0,-58 Z"
            fill="#FFFFFF" />
    </g>

    <!-- Label -->
    <g transform="translate(0 130)">
      <text text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">GitHub</text>
      <text y="26" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2.5" fill="#94A3B8">REMOTE  HOSTING</text>
    </g>

    <!-- Perforation coins -->
    <g fill="#0F172A" opacity="0.4">
      <circle cx="-220" cy="-180" r="14" />
      <circle cx="220" cy="-180" r="14" />
      <circle cx="-220" cy="180" r="14" />
      <circle cx="220" cy="180" r="14" />
    </g>
  </g>

  <!-- "&" entre les deux cartes -->
  <g transform="translate(760 600)">
    <circle r="44" fill="#0F172A" stroke="#FB923C" stroke-width="2.5" />
    <text text-anchor="middle" y="22" font-family="Bricolage Grotesque, sans-serif" font-size="56" font-weight="800" fill="#FB923C" letter-spacing="-0.04em">&amp;</text>
  </g>

  <!-- Étoiles décoratives -->
  <g fill="#FB923C" opacity="0.5">
    <circle cx="80" cy="500" r="2" />
    <circle cx="1480" cy="380" r="2.4" />
    <circle cx="120" cy="820" r="1.6" />
    <circle cx="1540" cy="780" r="1.8" />
    <circle cx="760" cy="180" r="2" />
  </g>
</svg>
