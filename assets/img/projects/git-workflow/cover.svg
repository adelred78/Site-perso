<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Git et GitHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1C" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="aurora-1" cx="0.2" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.04" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-2" cx="0.85" cy="0.9" r="0.65">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.06" />
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="git-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC" />
      <stop offset="1" stop-color="#0EA5E9" />
    </linearGradient>

    <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#aurora-1)" />
  <rect width="1600" height="900" fill="url(#aurora-2)" />

  <!-- Lignes horizontales très subtiles (effet ligne éditoriale) -->
  <g stroke="#FFFFFF" stroke-opacity="0.04">
    <line x1="80" y1="150" x2="1520" y2="150" />
    <line x1="80" y1="750" x2="1520" y2="750" />
  </g>

  <!-- HEADER éditorial très propre -->
  <g transform="translate(80 110)" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="3" fill="#64748B">
    <text>VERSION CONTROL · WORKFLOW</text>
    <text x="1440" text-anchor="end" fill="#475569">001 / GIT — GITHUB</text>
  </g>

  <!-- ============================== -->
  <!-- LOGO GIT (gauche) -->
  <!-- ============================== -->
  <g transform="translate(440 480)" filter="url(#logo-glow)">
    <!-- Diamant -->
    <g transform="rotate(45)">
      <rect x="-150" y="-150" width="300" height="300" rx="20" fill="none" stroke="url(#git-gradient)" stroke-width="9" />
    </g>

    <!-- Branches -->
    <g stroke="url(#git-gradient)" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M -95 0 L 95 0" />
      <path d="M 12 0 Q 12 -68, 80 -68" />
    </g>

    <!-- Commits -->
    <g fill="#7DD3FC">
      <circle cx="-95" cy="0" r="20" />
      <circle cx="95" cy="0" r="20" />
      <circle cx="80" cy="-68" r="18" />
    </g>
    <g fill="#0A0F1C">
      <circle cx="-95" cy="0" r="8" />
      <circle cx="95" cy="0" r="8" />
      <circle cx="80" cy="-68" r="7" />
    </g>
  </g>

  <!-- Séparateur central très fin -->
  <g transform="translate(800 480)">
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <text y="6" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" fill="#64748B">×</text>
  </g>

  <!-- ============================== -->
  <!-- LOGO GITHUB (droite) -->
  <!-- ============================== -->
  <g transform="translate(1160 480)" filter="url(#logo-glow)">
    <g transform="scale(2.4)">
      <path d="M 0,-58
               C -32,-58 -58,-32 -58,0
               C -58,25 -42,46 -19,53
               C -16,54 -15,52 -15,50
               L -15,43
               C -30,46 -33,36 -33,36
               C -35,31 -38,30 -38,30
               C -42,27 -38,27 -38,27
               C -33,28 -31,32 -31,32
               C -27,39 -20,37 -17,36
               C -16,33 -15,31 -13,30
               C -25,28 -36,24 -36,9
               C -36,4 -34,1 -32,-3
               C -32,-4 -34,-9 -31,-15
               C -31,-15 -27,-16 -19,-11
               C -16,-12 -12,-13 -8,-13
               C -4,-13 0,-12 3,-11
               C 11,-16 15,-15 15,-15
               C 18,-9 16,-4 16,-3
               C 19,1 21,3 21,9
               C 21,24 9,28 -2,29
               C 0,31 2,34 2,38
               L 2,50
               C 2,52 3,54 6,53
               C 29,46 45,25 45,0
               C 45,-32 19,-58 0,-58 Z"
            fill="#F8FAFC" />
    </g>
  </g>

  <!-- Labels sous les logos -->
  <g transform="translate(0 720)" font-family="Bricolage Grotesque, sans-serif" letter-spacing="-0.03em">
    <text x="440" y="0" text-anchor="middle" font-size="42" font-weight="700" fill="#F8FAFC">Git</text>
    <text x="1160" y="0" text-anchor="middle" font-size="42" font-weight="700" fill="#F8FAFC">GitHub</text>
  </g>

  <g transform="translate(0 770)" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="3" fill="#475569">
    <text x="440" text-anchor="middle">DISTRIBUTED  SCM</text>
    <text x="1160" text-anchor="middle">CLOUD  PLATFORM</text>
  </g>

  <!-- Tagline bottom -->
  <g transform="translate(80 830)" font-family="JetBrains Mono, monospace" font-size="12" fill="#475569" letter-spacing="2.5">
    <text>$ track · branch · merge · ship</text>
  </g>
</svg>
